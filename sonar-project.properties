sonar.projectKey=claudecodelab-iac
sonar.projectName=ClaudeCodeLab IaC
sonar.projectVersion=1.0

# Source directories
sonar.sources=terraform,bicep

# Exclusions — no need to scan provider lock files, state, or example vars
sonar.exclusions=\
  **/.terraform/**,\
  **/*.tfstate,\
  **/*.tfstate.backup,\
  **/*.tfvars,\
  **/.terraform.lock.hcl

# Encoding
sonar.sourceEncoding=UTF-8
