name: Deploy — AWS Terraform

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe DEPLOY para confirmar el despliegue"
        required: true
        type: string

permissions:
  contents: read

env:
  TF_VERSION: "1.10.0"
  WORKING_DIR: terraform/aws

jobs:
  guard:
    name: Verificar confirmación
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar confirmación
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "La cadena de confirmación no coincide. Abortando."
            exit 1
          fi

  deploy:
    name: Terraform Plan & Apply — AWS
    runs-on: ubuntu-latest
    needs: guard
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
      TF_VAR_key_name:       ${{ secrets.AWS_EC2_KEY_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_TF_STATE_BUCKET }}" \
            -backend-config="key=aws/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.AWS_TF_STATE_DYNAMODB_TABLE }}"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Plan
        run: terraform plan -out=aws.tfplan -input=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Subir artefacto del plan
        uses: actions/upload-artifact@v4
        with:
          name: aws-tfplan-${{ github.run_id }}
          path: ${{ env.WORKING_DIR }}/aws.tfplan
          retention-days: 7

      - name: Terraform Apply
        run: terraform apply -auto-approve aws.tfplan
        working-directory: ${{ env.WORKING_DIR }}

      - name: Mostrar outputs
        run: terraform output
        working-directory: ${{ env.WORKING_DIR }}
