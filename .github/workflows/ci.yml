name: CI — Terraform Lint, Validate, Plan & SonarQube

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.10.0"
  AZURE_DIR: terraform/azure
  AWS_DIR: terraform/aws

jobs:
  # ─────────────────────────────────────────────
  # 1. Terraform Format Check
  # ─────────────────────────────────────────────
  terraform-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: fmt check — Azure
        run: terraform fmt -check -recursive
        working-directory: ${{ env.AZURE_DIR }}

      - name: fmt check — AWS
        run: terraform fmt -check -recursive
        working-directory: ${{ env.AWS_DIR }}

  # ─────────────────────────────────────────────
  # 2. Terraform Validate — Azure
  # ─────────────────────────────────────────────
  terraform-validate-azure:
    name: Terraform Validate — Azure
    runs-on: ubuntu-latest
    needs: terraform-fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init (no backend)
        run: terraform init -backend=false
        working-directory: ${{ env.AZURE_DIR }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ env.AZURE_DIR }}

  # ─────────────────────────────────────────────
  # 3. Terraform Validate — AWS
  # ─────────────────────────────────────────────
  terraform-validate-aws:
    name: Terraform Validate — AWS
    runs-on: ubuntu-latest
    needs: terraform-fmt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init (no backend)
        run: terraform init -backend=false
        working-directory: ${{ env.AWS_DIR }}

      - name: Validate
        run: terraform validate
        working-directory: ${{ env.AWS_DIR }}

  # ─────────────────────────────────────────────
  # 4. Terraform Plan — Azure
  # ─────────────────────────────────────────────
  terraform-plan-azure:
    name: Terraform Plan — Azure
    runs-on: ubuntu-latest
    needs: terraform-validate-azure
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_vm_admin_username: ${{ secrets.AZURE_VM_ADMIN_USERNAME }}
      TF_VAR_vm_admin_password: ${{ secrets.AZURE_VM_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.AZURE_TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.AZURE_TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=azure/terraform.tfstate"
        working-directory: ${{ env.AZURE_DIR }}

      - name: Plan
        run: terraform plan -out=azure.tfplan -input=false
        working-directory: ${{ env.AZURE_DIR }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: azure-tfplan-${{ github.run_id }}
          path: ${{ env.AZURE_DIR }}/azure.tfplan
          retention-days: 7

  # ─────────────────────────────────────────────
  # 5. Terraform Plan — AWS
  # ─────────────────────────────────────────────
  terraform-plan-aws:
    name: Terraform Plan — AWS
    runs-on: ubuntu-latest
    needs: terraform-validate-aws
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
      TF_VAR_key_name:       ${{ secrets.AWS_EC2_KEY_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_TF_STATE_BUCKET }}" \
            -backend-config="key=aws/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.AWS_TF_STATE_DYNAMODB_TABLE }}"
        working-directory: ${{ env.AWS_DIR }}

      - name: Plan
        run: terraform plan -out=aws.tfplan -input=false
        working-directory: ${{ env.AWS_DIR }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aws-tfplan-${{ github.run_id }}
          path: ${{ env.AWS_DIR }}/aws.tfplan
          retention-days: 7

  # ─────────────────────────────────────────────
  # 6. SonarQube Scan
  # ─────────────────────────────────────────────
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs:
      - terraform-validate-azure
      - terraform-validate-aws
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN:    ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
