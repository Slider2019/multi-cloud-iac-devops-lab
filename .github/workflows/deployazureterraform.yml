name: Deploy — Azure Terraform

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Escribe DEPLOY para confirmar el despliegue"
        required: true
        type: string

permissions:
  contents: read

env:
  TF_VERSION: "1.10.0"
  WORKING_DIR: terraform/azure

jobs:
  guard:
    name: Verificar confirmación
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar confirmación
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "La cadena de confirmación no coincide. Abortando."
            exit 1
          fi

  deploy:
    name: Terraform Plan & Apply — Azure
    runs-on: ubuntu-latest
    needs: guard
    env:
      ARM_CLIENT_ID:            ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:        ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID:      ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:            ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_vm_admin_username: ${{ secrets.AZURE_VM_ADMIN_USERNAME }}
      TF_VAR_vm_admin_password: ${{ secrets.AZURE_VM_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.AZURE_TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.AZURE_TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=azure/terraform.tfstate"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Plan
        run: terraform plan -out=azure.tfplan -input=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Subir artefacto del plan
        uses: actions/upload-artifact@v4
        with:
          name: azure-tfplan-${{ github.run_id }}
          path: ${{ env.WORKING_DIR }}/azure.tfplan
          retention-days: 7

      - name: Terraform Apply
        run: terraform apply -auto-approve azure.tfplan
        working-directory: ${{ env.WORKING_DIR }}

      - name: Mostrar outputs
        run: terraform output
        working-directory: ${{ env.WORKING_DIR }}
