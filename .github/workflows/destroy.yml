name: Destroy Infrastructure

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which infrastructure to destroy"
        required: true
        type: choice
        options:
          - azure
          - aws
      confirm:
        description: "Type DESTROY to confirm"
        required: true
        type: string

permissions:
  contents: read

env:
  TF_VERSION: "1.10.0"

jobs:
  guard:
    name: Confirm destruction
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DESTROY" ]; then
            echo "Confirmation string does not match. Aborting."
            exit 1
          fi

  destroy-azure:
    name: Destroy — Azure
    runs-on: ubuntu-latest
    needs: guard
    if: github.event.inputs.target == 'azure'
    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      TF_VAR_vm_admin_username: ${{ secrets.AZURE_VM_ADMIN_USERNAME }}
      TF_VAR_vm_admin_password: ${{ secrets.AZURE_VM_ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.AZURE_TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.AZURE_TF_STATE_SA }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=azure/terraform.tfstate"
        working-directory: terraform/azure

      - name: Destroy
        run: terraform destroy -auto-approve -input=false
        working-directory: terraform/azure

  destroy-aws:
    name: Destroy — AWS
    runs-on: ubuntu-latest
    needs: guard
    if: github.event.inputs.target == 'aws'
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
      TF_VAR_key_name:       ${{ secrets.AWS_EC2_KEY_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.AWS_TF_STATE_BUCKET }}" \
            -backend-config="key=aws/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.AWS_TF_STATE_DYNAMODB_TABLE }}"
        working-directory: terraform/aws

      - name: Destroy
        run: terraform destroy -auto-approve -input=false
        working-directory: terraform/aws
